name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q ChatsWithGoogleChat.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/chats.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/chats.jks" >> "$GITHUB_ENV"
          else
            echo "No signing key found - using default debug key"
          fi

      - name: Build debug APK
        working-directory: ChatsWithGoogleChat
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: chats-apk
          path: ChatsWithGoogleChat/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ github.run_number }}" ChatsWithGoogleChat/app/build/outputs/apk/debug/app-debug.apk --title "v${{ github.run_number }}" --notes "APK"
